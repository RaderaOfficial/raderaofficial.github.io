<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music – Radera</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Ikoner -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* --------------------------------------------------
       1. Reset & Global Variables
       -------------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0a0a0c;
      --text-color: #ffffff;
      --text-muted: #a1a1aa;
      --accent-color: #ffffff;
      --accent-hover: #e2e2e2;
      --glass-bg: rgba(18, 18, 20, 0.75);
      --glass-card-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --------------------------------------------------
       2. Dynamic Background
       -------------------------------------------------- */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(to bottom, rgba(10, 10, 12, 0.65), rgba(10, 10, 12, 0.95)), url("background.jpg");
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* --------------------------------------------------
       3. Sticky Header
       -------------------------------------------------- */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 32px;
      z-index: 1000;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-left .header-logo {
      height: 40px;
      width: auto;
      display: block;
      transition: transform 0.2s ease;
    }

    .header-left .header-logo:hover {
      transform: scale(1.03);
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-center a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .header-center a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .header-center .header-booking {
      background: var(--text-color);
      color: #000 !important;
      font-weight: 700;
    }

    .header-center .header-booking:hover {
      background: #e2e2e2;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-right a {
      color: #ffffff;
      font-size: 20px;
      opacity: 0.85;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-right a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* --------------------------------------------------
       4. Main Content Area
       -------------------------------------------------- */
    main.main-container {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 130px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-align: center;
      background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Streaming Platforms Links */
    .platforms-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 50px;
      width: 100%;
    }

    .platform-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-card-bg);
      border: 1px solid var(--glass-border);
      padding: 12px 24px;
      border-radius: 30px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .platform-btn i {
      font-size: 20px;
    }

    .platform-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* Player Wrapper */
    .player-section {
      width: 100%;
      background: var(--glass-card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 30px;
    }

    .spotify-embed {
      width: 100%;
      border-radius: 12px;
      border: none;
    }

    /* Buy Button (Grön knapp) */
    .buy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #1DB954;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
      margin-bottom: 30px;
    }

    .buy-button:hover {
      background-color: #1ed760;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
    }

    /* --------------------------------------------------
       5. Footer / Social Links
       -------------------------------------------------- */
    footer.socials {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      padding: 20px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      color: #ffffff;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .socials a:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* --------------------------------------------------
       6. Responsiveness
       -------------------------------------------------- */
    @media (max-width: 768px) {
      .top-header {
        padding: 12px 20px;
      }

      .header-right {
        display: none;
      }

      main.main-container {
        padding-top: 100px;
      }

      .platforms-grid {
        gap: 10px;
      }

      .platform-btn {
        padding: 10px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Dynamic Background -->
  <div class="background-overlay"></div>

  <!-- Header -->
  <header class="top-header">
    <div class="header-left">
      <a href="index.html" aria-label="Hem">
        <img src="logovit2.png" alt="Radera Logotyp" class="header-logo">
      </a>
    </div>

    <nav class="header-center">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a class="header-booking" href="booking.html">Booking</a>
    </nav>

    <div class="header-right">
      <a href="https://www.instagram.com/raderaofficial/" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@raderaofficial" target="_blank" rel="noopener" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="https://www.youtube.com/@Radera" target="_blank" rel="noopener" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a href="https://www.facebook.com/RaderaOfficial" target="_blank" rel="noopener" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">

    <h1 class="page-title">Listen To Radera</h1>

    <!-- Streaming Platforms Quick Links -->
    <div class="platforms-grid">
      <a href="https://open.spotify.com/artist/46EIkN6JFpbbdqkkZK3oyj?si=vwjUTzmkSFqMV5pzKUT15w" target="_blank" rel="noopener" class="platform-btn">
        <i class="fa-brands fa-spotify"></i> Spotify
      </a>
      <a href="https://music.apple.com/us/artist/radera/1423333984" target="_blank" rel="noopener" class="platform-btn">
        <i class="fa-brands fa-apple"></i> Apple Music
      </a>
      <a href="https://soundcloud.com/raderaofficial" target="_blank" rel="noopener" class="platform-btn">
        <i class="fa-brands fa-soundcloud"></i> SoundCloud
      </a>
      <a href="https://music.youtube.com/channel/UCAct0H20jkdf_CV--4q1ozw" target="_blank" rel="noopener" class="platform-btn">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>
    </div>

    <!-- Spotify Embed Player -->
    <section class="player-section">
      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/7iwQdWc0OmE43tEJOBHQKe?utm_source=generator&si=ab5c220ce1664ec6" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </section>

    <!-- Buy Button -->
    <a class="buy-button" href="https://radera.gumroad.com/" target="_blank" rel="noopener">
      <i class="fa-solid fa-cart-shopping"></i> Buy the extended edit
    </a>

    <!-- Socials bottom -->
    <footer class="socials">
      <a href="https://www.instagram.com/raderaofficial/" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@raderaofficial" target="_blank" rel="noopener" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="https://www.youtube.com/@Radera" target="_blank" rel="noopener" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a href="https://www.facebook.com/RaderaOfficial" target="_blank" rel="noopener" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="mailto:booking@radera.dj" aria-label="E-post Bokning">
        <i class="fa-regular fa-envelope"></i>
      </a>
    </footer>

  </main>

</body>
</html>
