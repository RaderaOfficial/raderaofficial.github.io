<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radera – Official Website</title>
  
  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* --------------------------------------------------
       1. Reset & Global Variables
       -------------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0a0a0c;
      --text-color: #ffffff;
      --text-muted: #a1a1aa;
      --accent-color: #1db954;
      --accent-hover: #1ed760;
      --glass-bg: rgba(18, 18, 20, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --------------------------------------------------
       2. Dynamic Background
       -------------------------------------------------- */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(to bottom, rgba(10, 10, 12, 0.6), rgba(10, 10, 12, 0.95)), url("background.jpg");
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* --------------------------------------------------
       3. Header & Navigation
       -------------------------------------------------- */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 32px;
      z-index: 1000;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-left .header-logo {
      height: 40px;
      width: auto;
      display: block;
      transition: transform 0.2s ease;
    }

    .header-left .header-logo:hover {
      transform: scale(1.03);
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-center a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .header-center a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .header-center .header-booking {
      background: var(--text-color);
      color: #000 !important;
      font-weight: 700;
    }

    .header-center .header-booking:hover {
      background: #e2e2e2;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-right a img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      opacity: 0.8;
      transition: all 0.2s ease;
      filter: invert(1);
    }

    .header-right a:hover img {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* --------------------------------------------------
       4. Main Content Area
       -------------------------------------------------- */
    main.main-container {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 140px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .tagline {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio-text {
      max-width: 680px;
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 48px;
    }

    /* --------------------------------------------------
       5. Media / Spotify Section
       -------------------------------------------------- */
    .spotify-section {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: rgba(255, 255, 255, 0.03);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .spotify-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .buy-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 16px 28px;
      background: var(--accent-color);
      color: #000;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
    }

    .buy-button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
    }

    /* --------------------------------------------------
       6. Footer / Social Links
       -------------------------------------------------- */
    footer.socials {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-top: 60px;
      padding: 20px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    .socials img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: invert(1);
    }

    .socials a:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* --------------------------------------------------
       7. Responsiveness
       -------------------------------------------------- */
    @media (max-width: 768px) {
      .top-header {
        padding: 12px 20px;
      }

      .header-right {
        display: none; /* Dölj sociala ikoner i headern på mobil för renare layout */
      }
      
      main.main-container {
        padding-top: 100px;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="background-overlay"></div>

  <!-- Header -->
  <header class="top-header">
    <div class="header-left">
      <a href="index.html" aria-label="Hem">
        <img src="logovit2.png" alt="Radera Logotyp" class="header-logo">
      </a>
    </div>

    <nav class="header-center">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a class="header-booking" href="booking.html">Booking</a>
    </nav>

    <div class="header-right">
      <a href="https://www.instagram.com/raderaofficial/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="instagram.png" alt="Instagram">
      </a>
      <a href="https://www.tiktok.com/@raderaofficial" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="tiktok.png" alt="TikTok">
      </a>
      <a href="https://www.youtube.com/@Radera" target="_blank" rel="noopener" aria-label="YouTube">
        <img src="youtube2.png" alt="YouTube">
      </a>
      <a href="https://www.facebook.com/RaderaOfficial" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="facebook.png" alt="Facebook">
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    
    <h1 class="tagline">Spotify Playlist</h1>

    <p class="bio-text">
      You can find Radera's music on all major streaming platforms. Radera brings a high-energy mix of Hardstyle, Rawstyle, Frenchcore, and Uptempo.
    </p>

    <!-- Spotify Container -->
    <section class="spotify-section">
      <div class="spotify-wrapper">
        <iframe 
          style="border-radius: 12px;" 
          src="https://open.spotify.com/embed/playlist/7iwQdWc0OmE43tEJOBHQKe?utm_source=generator" 
          width="100%" 
          height="380" 
          frameborder="0" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
          loading="lazy">
        </iframe>
      </div>

      <a class="buy-button" href="https://radera.gumroad.com/" target="_blank" rel="noopener">
        Buy the extended edit
      </a>
    </section>

    <!-- Footer Social Icons -->
    <footer class="socials">
      <a href="https://www.instagram.com/raderaofficial/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="instagram.png" alt="Instagram">
      </a>
      <a href="https://www.tiktok.com/@raderaofficial" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="tiktok.png" alt="TikTok">
      </a>
      <a href="https://www.youtube.com/@Radera" target="_blank" rel="noopener" aria-label="YouTube">
        <img src="youtube.png" alt="YouTube">
      </a>
      <a href="https://www.facebook.com/RaderaOfficial" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="facebook.png" alt="Facebook">
      </a>
      <a href="mailto:Booking@Radera.dj" aria-label="E-post Bokning">
        <img src="booking.png" alt="Booking Email">
      </a>
    </footer>

  </main>

</body>
</html>
